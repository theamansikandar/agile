apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-calc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: student-calc
  template:
    metadata:
      labels:
        app: student-calc
    spec:
      containers:
      - name: app
        image: theamansikandar/student-calc:v1
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: student-calc-service
spec:
  type: NodePort
  selector:
    app: student-calc
  ports:
    - port: 80
      targetPort: 5000
      nodePort: 30080


